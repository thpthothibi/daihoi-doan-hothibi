<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khởi tạo tài khoản Đại hội</title><link rel="stylesheet" href="assets/tailwind.css"><body class="bg-slate-100 min-h-screen flex items-center justify-center p-5"><main class="bg-white max-w-lg w-full p-6 rounded-2xl shadow space-y-4"><h1 class="text-xl font-extrabold text-slate-900">Khởi tạo tài khoản máy chủ</h1><p class="text-sm text-slate-600">Chỉ thực hiện một lần sau khi triển khai Worker và tạo D1. Không có mật khẩu mặc định. Giữ riêng khóa và mật khẩu.</p><form id="setup-form" class="space-y-4"><label class="block text-sm font-bold">Địa chỉ Worker<input id="api" type="url" required class="block w-full border rounded-lg p-2 mt-1"></label><label class="block text-sm font-bold">Khóa ADMIN_SYNC_TOKEN hiện có<input id="key" type="password" required autocomplete="off" class="block w-full border rounded-lg p-2 mt-1"></label><label class="block text-sm font-bold">Mật khẩu mới của admin (ít nhất 12 ký tự)<input id="admin" type="password" required minlength="12" maxlength="128" autocomplete="new-password" class="block w-full border rounded-lg p-2 mt-1"></label><label class="block text-sm font-bold">Mật khẩu mới của bch (ít nhất 12 ký tự)<input id="bch" type="password" required minlength="12" maxlength="128" autocomplete="new-password" class="block w-full border rounded-lg p-2 mt-1"></label><button class="bg-sky-700 text-white font-bold px-4 py-2 rounded-xl" type="submit">Tạo hai tài khoản</button></form><p id="status" role="status" class="text-sm break-words"></p><a href="./" class="text-sky-700 text-sm">Về trang Đại hội</a></main><script src="assets/setup.js"></script></body></html>
